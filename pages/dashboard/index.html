<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft 服务器管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">⬢</span>
      <div>
        <h1>Minecraft 服务器管理</h1>
        <p class="brand-sub">RCON · 聊天桥接 · 静默调度</p>
      </div>
    </div>
    <div class="conn-pill" id="conn"><span class="dot"></span><span class="conn-text">连接中</span></div>
  </header>

  <main>
    <section class="card accent" id="overview">
      <div class="card-head">
        <h2><span class="ico">▣</span> 服务器总览</h2>
        <button class="btn ghost" id="btn-refresh">刷新</button>
      </div>
      <div class="kpis four">
        <div class="kpi"><span class="kpi-label">默认服务器</span><span class="kpi-value" id="m-server">—</span></div>
        <div class="kpi"><span class="kpi-label">当前 TPS</span><span class="kpi-value good" id="m-tps">—</span></div>
        <div class="kpi"><span class="kpi-label">在线玩家</span><span class="kpi-value" id="m-online">—</span></div>
        <div class="kpi"><span class="kpi-label">今日消息</span><span class="kpi-value" id="m-msg">—</span></div>
      </div>
      <div class="panel">
        <div class="panel-title">TPS 趋势 <span class="hint" id="tps-hint"></span></div>
        <div class="chart" id="chart-tps"><svg id="tps-svg"></svg></div>
      </div>
    </section>

    <section class="card" id="servers">
      <div class="card-head"><h2><span class="ico">🖥</span> 服务器列表</h2></div>
      <div id="server-cards" class="server-grid"></div>
    </section>

    <section class="card" id="players">
      <div class="card-head"><h2><span class="ico">👥</span> 在线玩家</h2></div>
      <div id="player-list" class="player-list"></div>
    </section>

    <section class="card" id="top">
      <div class="card-head"><h2><span class="ico">⏱</span> 今日在线时长 TOP</h2></div>
      <div id="top-list" class="top-list"></div>
    </section>

    <section class="card" id="silent">
      <div class="card-head"><h2><span class="ico">🔕</span> 静默控制</h2></div>
      <div class="toggle-row">
        <label class="switch">
          <input type="checkbox" id="s-toggle">
          <span class="slider"></span>
        </label>
        <span class="toggle-label" id="s-state">当前未静默</span>
      </div>
      <div class="field">
        <label>临时静默时长</label>
        <div class="segrow">
          <button class="seg" data-dur="30m">30 分钟</button>
          <button class="seg" data-dur="1h">1 小时</button>
          <button class="seg" data-dur="2h">2 小时</button>
          <button class="seg" data-dur="4h">4 小时</button>
        </div>
      </div>
      <div class="field">
        <label>每日定时静默</label>
        <div class="cmdrow">
          <input id="s-sched" type="text" placeholder="如 21:00-08:00">
          <button class="btn" id="s-sched-btn">应用定时</button>
        </div>
      </div>
      <button class="btn danger" id="s-off">结束静默</button>
      <span class="msg" id="s-msg"></span>
    </section>

    <section class="card" id="config">
      <div class="card-head"><h2><span class="ico">⚙</span> 配置</h2></div>
      <div class="field"><label>桥接转发目标会话</label><input id="c-target" type="text" placeholder="aiocqhttp:group:123456"></div>
      <div class="field"><label>默认服务器</label><input id="c-server" type="text" placeholder="default"></div>
      <div class="field"><label>TPS 采样间隔（分钟）</label><input id="c-tpsint" type="number" min="1" placeholder="10"></div>
      <div class="field-actions"><button class="btn" id="btn-save">保存配置</button><span class="msg" id="cfg-msg"></span></div>
    </section>

    <section class="card" id="auto">
      <div class="card-head"><h2><span class="ico">🤖</span> 自动行为开关</h2></div>
      <div class="switches" id="sw-list"></div>
      <div class="sw-trigger" id="sw-trigger">—</div>
      <span class="msg" id="sw-msg"></span>
    </section>

    <section class="card" id="ctrl">
      <div class="card-head"><h2><span class="ico">🎮</span> 服务器控制</h2></div>
      <div class="ctrlrow">
        <button class="btn" id="c-backup">立即备份</button>
        <button class="btn warn" id="c-save">保存世界</button>
        <button class="btn danger" id="c-stop">停止服务器</button>
      </div>
      <pre id="ctrl-out" class="mono">—</pre>
    </section>
  </main>

  <script>
    let bridge = null;
    const $ = (id) => document.getElementById(id);
    const setText = (id, v) => { $(id).textContent = (v == null || v === '') ? '—' : v; };

    // 自动触发行为的开关：key 必须与插件 _TOGGLE_KEYS 中的配置项同名
    const TOGGLES = [
      { key: 'silent_stats_enabled', label: '静默周期统计播报', tip: '总开关。关闭后任何情况都不再自动向群发送统计', group: '统计' },
      { key: 'silent_stats_on_auto_exit', label: '定时静默结束时播报', tip: '推荐时机：每日定时静默时段自动结束的那一刻', group: '统计' },
      { key: 'silent_stats_on_auto_enter', label: '定时静默开始时播报', tip: '默认关闭，避免与「结束时播报」重复', group: '统计' },
      { key: 'silent_stats_on_manual', label: '手动静默结束时也播报', tip: '默认关闭：手动开关静默不触发统计播报', group: '统计' },
      { key: 'silent_replay_enabled', label: '静默结束回放汇总', tip: '静默结束时发送「共收到 N 条动态」', group: '静默' },
      { key: 'silent_replay_detail', label: '回放包含聊天明细', tip: '逐条列出静默期间的聊天内容（最多 50 条）', group: '静默' },
      { key: 'tps_sampling_enabled', label: 'TPS 定时采样', tip: '后台采样 TPS；需同时启用「性能监控」', group: '采集' },
      { key: 'playtime_tracking_enabled', label: '玩家在线时长统计', tip: '通过加入/退出事件统计每日时长', group: '采集' },
      { key: 'bridge_notify_advancement', label: '转发成就通知', tip: 'MC → QQ', group: '转发' },
      { key: 'bridge_notify_death', label: '转发死亡通知', tip: 'MC → QQ', group: '转发' },
      { key: 'bridge_notify_join_quit', label: '转发进出服通知', tip: 'MC → QQ', group: '转发' },
      { key: 'bridge_mc_to_qq', label: 'MC → QQ 转发', tip: '游戏内聊天转进群', group: '转发' },
      { key: 'bridge_qq_to_mc', label: 'QQ → MC 转发', tip: '群消息广播进游戏', group: '转发' },
      { key: 'bridge_filter_commands', label: '过滤命令消息', tip: '以 / ! . 开头的群消息不转发进游戏', group: '转发' },
    ];

    function fmtSecs(s) {
      s = Math.max(0, Math.floor(s || 0));
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
      if (h) return `${h}h ${m}m`;
      if (m) return `${m}m`;
      return `${s}s`;
    }

    function drawTpsSeries(points) {
      const svg = $('tps-svg');
      const W = svg.clientWidth || 600, H = 130;
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      if (!points || points.length < 2) {
        svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--text-3)">暂无 TPS 样本</text>`;
        return;
      }
      const vals = points.map(p => p.value);
      const pad = 8;
      const minV = Math.max(0, Math.min(...vals) - 1);
      const maxV = Math.min(20, Math.max(...vals) + 1);
      const dx = (W - pad * 2) / (points.length - 1);
      const y = (v) => H - pad - ((v - minV) / (maxV - minV || 1)) * (H - pad * 2);
      const path = points.map((p, i) => `${i ? 'L' : 'M'}${(pad + i * dx).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
      let area = `${path} L${(pad + (points.length-1)*dx).toFixed(1)},${H - pad} L${pad},${H - pad} Z`;
      const last = points[points.length - 1];
      svg.innerHTML = `
        <path d="${area}" fill="var(--accent-soft)" stroke="none"/>
        <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="${(pad + (points.length-1)*dx).toFixed(1)}" cy="${y(last.value).toFixed(1)}" r="3.5" fill="var(--accent)"/>
        <text x="${W - pad}" y="${y(last.value) - 8}" text-anchor="end" fill="var(--accent)" font-size="11">${last.value.toFixed(1)} TPS</text>`;
    }

    async function loadOverview() {
      try {
        const d = await window.AstrBotPluginPage.apiGet('overview');
        setText('m-server', d.server);
        setText('m-tps', d.tps != null ? d.tps.toFixed(1) : '未启用');
        setText('m-online', `${d.online_count} / ${d.max_players ?? '-'}`);
        setText('m-msg', d.msg_count);
        renderTop(d.playtime_top || []);
        setConn(true, '已连接');
      } catch (e) { setText('m-server', '加载失败'); }
    }

    function renderTop(top) {
      const el = $('top-list');
      if (!top.length) { el.innerHTML = '<div class="empty">今日暂无在线时长记录</div>'; return; }
      const max = top[0].seconds || 1;
      el.innerHTML = top.map((t, i) => `
        <div class="top-row">
          <span class="top-rank">${i + 1}</span>
          <span class="top-name">${t.player}</span>
          <span class="top-bar"><span style="width:${(t.seconds / max * 100).toFixed(1)}%"></span></span>
          <span class="top-time">${fmtSecs(t.seconds)}</span>
        </div>`).join('');
    }

    function renderPlayers(players) {
      const el = $('player-list');
      if (!players || !players.length) { el.innerHTML = '<div class="empty">当前无人在线</div>'; return; }
      el.innerHTML = players.map(p => `
        <div class="player-row">
          <span class="player-name">${p}</span>
          <span class="player-acts">
            <button class="mini" data-act="kick" data-p="${p}">踢出</button>
            <button class="mini" data-act="op" data-p="${p}">给 OP</button>
            <button class="mini" data-act="deop" data-p="${p}">去 OP</button>
          </span>
        </div>`).join('');
    }

    async function loadServers() {
      try {
        const d = await window.AstrBotPluginPage.apiGet('servers');
        const el = $('server-cards');
        if (!d.servers || !d.servers.length) { el.innerHTML = '<div class="empty">未配置服务器</div>'; return; }
        el.innerHTML = d.servers.map(s => `
          <div class="server-card ${s.reachable ? '' : 'down'}">
            <div class="sc-head"><span class="sc-name">${s.name}</span>
              <span class="badge ${s.reachable ? 'ok' : 'err'}">${s.reachable ? '在线' : '离线'}</span></div>
            <div class="sc-host">${s.host}:${s.port}</div>
            <div class="sc-meta">
              <span>在线 <b>${s.online_count}</b></span>
              <span>TPS <b>${s.tps != null ? s.tps.toFixed(1) : '—'}</b></span>
            </div>
            <div class="sc-players">${s.online && s.online.length ? s.online.join(', ') : '无人在线'}</div>
          </div>`).join('');
      } catch (e) { $('server-cards').innerHTML = '<div class="empty">加载失败</div>'; }
    }

    async function loadPlayers() {
      try {
        const d = await window.AstrBotPluginPage.apiGet('players');
        renderPlayers(d.players);
      } catch (e) { $('player-list').innerHTML = '<div class="empty">加载失败</div>'; }
    }

    async function loadTps() {
      try {
        const d = await window.AstrBotPluginPage.apiGet('tps-history');
        drawTpsSeries(d.series || []);
        $('tps-hint').textContent = `${(d.series || []).length} 个样本`;
      } catch (e) { drawTpsSeries([]); }
    }

    async function loadConfig() {
      try {
        const d = await window.AstrBotPluginPage.apiGet('config');
        $('c-target').value = d.bridge_target || '';
        $('c-server').value = d.default_server || '';
        $('c-tpsint').value = d.tps_interval || 10;
        renderSwitches(d);
      } catch (e) { $('cfg-msg').textContent = '加载失败: ' + e; }
    }

    function renderSwitches(d) {
      const el = $('sw-list');
      if (!el) return;
      el.innerHTML = TOGGLES.map(t => `
        <label class="sw-row">
          <span class="sw-text">
            <span class="sw-name">${t.label}</span>
            <span class="sw-tip">${t.tip}</span>
          </span>
          <span class="switch small">
            <input type="checkbox" id="sw-${t.key}" ${d[t.key] ? 'checked' : ''}>
            <span class="slider"></span>
          </span>
        </label>`).join('');
      TOGGLES.forEach(t => on(`sw-${t.key}`, 'onchange', (e) => togglePost(t.key, e.target.checked)));
      const trg = $('sw-trigger');
      if (trg) trg.textContent = '📊 统计播报时机：' + (d.stats_trigger || '—');
    }

    async function togglePost(key, val) {
      const msg = $('sw-msg');
      try {
        await window.AstrBotPluginPage.apiPost('config', { [key]: val });
        if (msg) { msg.textContent = '✓ 已保存并即时生效'; msg.className = 'msg ok'; }
        loadConfig();
      } catch (e) {
        if (msg) { msg.textContent = '保存失败: ' + e; msg.className = 'msg err'; }
      }
    }

    async function loadSilent() {
      try {
        const d = await window.AstrBotPluginPage.apiGet('silent');
        $('s-toggle').checked = d.active;
        $('s-state').textContent = d.active ? '静默中' : '当前未静默';
        if (d.schedule) $('s-sched').value = d.schedule;
      } catch (e) {}
    }

    async function saveConfig() {
      try {
        const r = await window.AstrBotPluginPage.apiPost('config', {
          bridge_target: $('c-target').value,
          default_server: $('c-server').value,
          tps_interval: parseInt($('c-tpsint').value, 10) || 10,
        });
        $('cfg-msg').textContent = r.saved ? '✓ 已保存' : '保存失败';
        $('cfg-msg').className = r.saved ? 'msg ok' : 'msg err';
      } catch (e) { $('cfg-msg').textContent = '保存失败: ' + e; }
      $('cfg-msg').className = 'msg err';
    }

    async function silentPost(payload) {
      try {
        await window.AstrBotPluginPage.apiPost('silent', payload);
        loadSilent();
        $('s-msg').textContent = '✓ 已应用';
        $('s-msg').className = 'msg ok';
      } catch (e) { $('s-msg').textContent = '失败: ' + e; $('s-msg').className = 'msg err'; }
    }

    async function ctrlPost(payload, outId) {
      try {
        $(outId).textContent = '执行中…';
        const r = await window.AstrBotPluginPage.apiPost('server-control', payload);
        $(outId).textContent = r.result || '（无输出）';
      } catch (e) { $(outId).textContent = '失败: ' + e; }
    }

    async function playerPost(action, player) {
      try {
        const r = await window.AstrBotPluginPage.apiPost('player-action', { action, player });
        alert(`${player}: ${r.result || 'ok'}`);
        loadPlayers();
      } catch (e) { alert('失败: ' + e); }
    }

    async function waitBridge(timeoutMs = 8000) {
      const start = Date.now();
      while (Date.now() - start < timeoutMs) {
        if (window.AstrBotPluginPage) return true;
        await new Promise((r) => setTimeout(r, 100));
      }
      return false;
    }
    function setConn(ok, text) {
      const pill = $('conn');
      if (!pill) return;
      pill.classList.toggle('ok', ok); pill.classList.toggle('err', !ok);
      const t = pill.querySelector('.conn-text');
      if (t) t.textContent = text;
    }

    async function init() {
      // SDK 若已注入则立即就绪，否则轮询等待；避免 8s 超时导致连接状态延迟
      const ok = !!window.AstrBotPluginPage || (await waitBridge());
      setConn(ok, ok ? '已连接' : '连接失败');
      if (ok) {
        try { await Promise.race([window.AstrBotPluginPage.ready(), new Promise(r => setTimeout(r, 800))]); } catch (e) {}
      }
      loadOverview(); loadServers(); loadPlayers(); loadTps(); loadConfig(); loadSilent();
      // 二次兜底：数据接口若可调用，说明 bridge 已可用，强制置为已连接
      try {
        await window.AstrBotPluginPage.apiGet('players');
        setConn(true, '已连接');
      } catch (e) {}
    }

    function on(id, prop, fn) { const el = document.getElementById(id); if (el) el[prop] = fn; }
    function bindEvents() {
      on('btn-refresh', 'onclick', () => { loadOverview(); loadServers(); loadPlayers(); loadTps(); });
      on('btn-save', 'onclick', saveConfig);
      on('s-toggle', 'onchange', (e) => {
        if (e.target.checked) silentPost({ action: 'on', duration: '1h' });
        else silentPost({ action: 'off' });
      });
      on('s-off', 'onclick', () => silentPost({ action: 'off' }));
      on('s-sched-btn', 'onclick', () => silentPost({ action: 'schedule', value: $('#s-sched').value }));
      document.querySelectorAll('.seg').forEach(btn => btn.onclick = () => silentPost({ action: 'on', duration: btn.dataset.dur }));
      on('c-backup', 'onclick', () => ctrlPost({ action: 'backup' }, 'ctrl-out'));
      on('c-save', 'onclick', () => ctrlPost({ action: 'save' }, 'ctrl-out'));
      on('c-stop', 'onclick', () => { if (confirm('确定停止服务器？')) ctrlPost({ action: 'stop' }, 'ctrl-out'); });
      on('player-list', 'onclick', (e) => {
        const b = e.target.closest('button.mini');
        if (b) playerPost(b.dataset.act, b.dataset.p);
      });
    }

    // 确保 init 一定执行：init 先于 bindEvents，且 bindEvents 用 null 保护不中断
    let started = false;
    function boot() {
      if (started) return;
      started = true;
      init();                       // 先加载数据 + 设置连接状态
      try { bindEvents(); } catch (e) { console.error('bind failed:', e); }
    }
    // DOM 未完全就绪时用 load 事件；已就绪则立即执行；再 800ms 兜底防止事件漏触发
    if (document.readyState === 'complete') {
      boot();
    } else {
      window.addEventListener('load', boot);
      setTimeout(() => { if (!started) boot(); }, 800);
    }
  </script>
</body>
</html>
