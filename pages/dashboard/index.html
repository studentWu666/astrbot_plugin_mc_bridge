<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC 服务器管理面板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>MC 服务器管理面板</h1>
    <span class="conn" id="conn">连接中…</span>
  </header>

  <main>
    <section class="card" id="overview">
      <h2>服务器总览</h2>
      <div class="grid">
        <div class="metric"><label>默认服务器</label><b id="m-server">—</b></div>
        <div class="metric"><label>当前 TPS</label><b id="m-tps">—</b></div>
      </div>
      <div class="block">
        <h3>状态</h3>
        <pre id="p-status" class="mono">—</pre>
      </div>
      <div class="block">
        <h3>在线玩家</h3>
        <pre id="p-players" class="mono">—</pre>
      </div>
      <button id="btn-refresh">刷新</button>
    </section>

    <section class="card" id="playtime">
      <h2>玩家在线时长</h2>
      <button id="btn-playtime" class="ghost">刷新今日</button>
      <pre id="p-playtime" class="mono">—</pre>
    </section>

    <section class="card" id="stats">
      <h2>静默统计</h2>
      <button id="btn-stats" class="ghost">刷新统计</button>
      <div class="grid">
        <div class="metric"><label>静默中</label><b id="m-silent">—</b></div>
        <div class="metric"><label>累计消息</label><b id="m-msg">—</b></div>
        <div class="metric"><label>TPS 样本</label><b id="m-smp">—</b></div>
        <div class="metric"><label>均值 TPS</label><b id="m-avg">—</b></div>
      </div>
      <pre id="p-status2" class="mono">—</pre>
    </section>

    <section class="card" id="config">
      <h2>配置</h2>
      <label>桥接转发目标会话</label>
      <input id="c-target" type="text" placeholder="aiocqhttp:group:123456">
      <label>默认服务器</label>
      <input id="c-server" type="text" placeholder="default">
      <label>TPS 采样间隔（分钟）</label>
      <input id="c-tpsint" type="number" min="1">
      <button id="btn-save">保存配置</button>
      <span class="msg" id="cfg-msg"></span>
    </section>

    <section class="card" id="command">
      <h2>执行 MC 指令</h2>
      <div class="cmdrow">
        <input id="cmd-input" type="text" placeholder="如 list / time set day">
        <button id="btn-cmd">发送</button>
      </div>
      <pre id="cmd-out" class="mono">—</pre>
    </section>
  </main>

  <script>
    const bridge = window.AstrBotPluginPage;
    const $ = (id) => document.getElementById(id);
    function setText(id, v) { $(id).textContent = v == null || v === '' ? '—' : v; }

    async function loadOverview() {
      try {
        const d = await bridge.apiGet('overview');
        setText('m-server', d.server);
        setText('m-tps', d.tps != null ? d.tps.toFixed(1) : '无/未启用');
        setText('p-status', d.status);
        setText('p-players', d.players);
      } catch (e) { setText('p-status', '加载失败: ' + e); }
    }
    async function loadPlaytime() {
      try {
        const d = await bridge.apiGet('playtime');
        setText('p-playtime', d.text);
      } catch (e) { setText('p-playtime', '加载失败: ' + e); }
    }
    async function loadStats() {
      try {
        const d = await bridge.apiGet('stats');
        setText('m-silent', d.silent ? '是' : '否');
        setText('m-msg', d.msg_count);
        setText('m-smp', d.tps_samples);
        setText('m-avg', d.avg_tps != null ? d.avg_tps : '—');
        setText('p-status2', d.silent_status);
      } catch (e) { setText('p-status2', '加载失败: ' + e); }
    }
    async function loadConfig() {
      try {
        const d = await bridge.apiGet('config');
        $('c-target').value = d.bridge_target || '';
        $('c-server').value = d.default_server || '';
        $('c-tpsint').value = d.tps_interval || 10;
      } catch (e) { $('cfg-msg').textContent = '加载失败: ' + e; }
    }
    async function saveConfig() {
      try {
        const r = await bridge.apiPost('config', {
          bridge_target: $('c-target').value,
          default_server: $('c-server').value,
          tps_interval: parseInt($('c-tpsint').value, 10) || 10,
        });
        $('cfg-msg').textContent = r.saved ? '已保存: ' + r.updated.join(', ') : '保存失败';
      } catch (e) { $('cfg-msg').textContent = '保存失败: ' + e; }
    }
    async function sendCommand() {
      const cmd = $('cmd-input').value.trim();
      if (!cmd) return;
      try {
        const r = await bridge.apiPost('command', { command: cmd });
        $('cmd-out').textContent = r.result || '（无输出）';
      } catch (e) { $('cmd-out').textContent = '失败: ' + e; }
    }

    async function init() {
      try { await bridge.ready(); setText('conn', '已连接'); } catch (e) { setText('conn', '连接失败'); }
      loadOverview(); loadPlaytime(); loadStats(); loadConfig();
    }
    document.getElementById('btn-refresh').onclick = loadOverview;
    document.getElementById('btn-playtime').onclick = loadPlaytime;
    document.getElementById('btn-stats').onclick = loadStats;
    document.getElementById('btn-save').onclick = saveConfig;
    document.getElementById('btn-cmd').onclick = sendCommand;
    document.getElementById('cmd-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendCommand(); });
    init();
  </script>
</body>
</html>
